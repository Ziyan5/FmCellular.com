<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#101a3f">
  <title>FM Cellular Admin — Choose a password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Where the "reset your password" and "you have been invited" emails land. -->
  <section class="auth" id="recovery-view">
    <div class="auth-card">
      <div class="auth-brand"><span class="logo-mark">FM</span><span>FM Cellular <b>Admin</b></span></div>
      <h1>Choose a password</h1>
      <p class="muted" id="recovery-intro">Checking your link…</p>
      <form id="recovery-form" class="stack" hidden>
        <label class="field"><span>New password</span><input id="new-password" type="password" autocomplete="new-password" minlength="8" required><small>At least 8 characters.</small></label>
        <label class="field"><span>Type it again</span><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn primary big" type="submit">Save password</button>
        <p class="message" id="recovery-form-message" role="status"></p>
      </form>
      <a class="link" href="/">Back to sign in</a>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script>window.supabase || document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"><\/script>');</script>
  <script src="config.js"></script>
  <script src="recovery.js"></script>
</body>
</html>
