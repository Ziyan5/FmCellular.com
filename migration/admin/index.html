<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#101a3f">
  <title>FM Cellular Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Signed out -->
  <section class="auth" id="login-view" hidden>
    <div class="auth-card">
      <div class="auth-brand"><span class="logo-mark">FM</span><span>FM Cellular <b>Admin</b></span></div>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to manage phones, parts, photos and posters.</p>
      <form id="login-form" class="stack">
        <label class="field"><span>Email</span><input id="email" type="email" autocomplete="username" required></label>
        <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary big" type="submit">Sign in</button>
        <p class="message" id="login-message" role="status"></p>
      </form>
      <button class="link" id="forgot-password" type="button">Forgot your password?</button>
      <form id="recovery-request-form" class="stack" hidden>
        <label class="field"><span>Your email</span><input id="recovery-email" type="email" autocomplete="username" required></label>
        <button class="btn primary" type="submit">Email me a reset link</button>
        <button class="link" id="cancel-recovery" type="button">Back to sign in</button>
        <p class="message" id="recovery-message" role="status"></p>
      </form>
    </div>
  </section>

  <!-- Signed in -->
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="side-brand" href="#/"><span class="logo-mark">FM</span><span>FM Cellular</span></a>
      <nav class="side-nav" aria-label="Sections">
        <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Home</a>
        <a href="#/devices" data-nav="devices"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M11 18.5h2"/></svg>Phones &amp; devices</a>
        <a href="#/parts" data-nav="parts"><svg viewBox="0 0 24 24"><path d="M14.5 5.5l4 4-9 9h-4v-4z"/><path d="M12.5 7.5l4 4"/></svg>Parts</a>
        <a href="#/prices" data-nav="prices"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5V20M15 9.5V20"/></svg>Price sheet</a>
        <a href="#/posters" data-nav="posters"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg>Posters</a>
        <a href="#/activity" data-nav="activity"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8.5"/></svg>Activity</a>
        <a href="#/team" data-nav="team" data-owner-only><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 5.5a3 3 0 0 1 0 5.8M17.5 19a5 5 0 0 0-2.4-4.3"/></svg>Team</a>
      </nav>
      <div class="side-foot">
        <button class="side-tool" id="sync-sheet" type="button" data-owner-only>Copy from Google Sheet</button>
        <div class="me"><span class="avatar" id="me-avatar">?</span><div><b id="me-name">…</b><small id="me-email"></small></div></div>
        <button class="btn ghost small" id="sign-out" type="button">Sign out</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu" id="menu-toggle" type="button" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="search" role="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
          <input id="global-search" type="search" placeholder="Search phones and parts…   (press /)" autocomplete="off" aria-label="Search phones and parts">
          <div class="search-results" id="search-results" hidden></div>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-root" id="modal-root"></div>

  <!-- The shop's own colour lists and photo library, so staff see the same
       colours and pictures a shopper does. Public files from the live site. -->
  <script src="https://www.fmcellular.com/catalog-maps.js"></script>
  <script src="https://www.fmcellular.com/photo-library.js"></script>
  <!-- One fixed version, so an update at the library's end can never change
       how the admin behaves; and a second place to get it from if the first
       is down. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script>window.supabase || document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"><\/script>');</script>
  <script src="config.js"></script>
  <!-- The admin is several files. Just after an update a browser can hold a
       mix of old and new ones and fail to start: fetch them all fresh once
       and reload, instead of leaving a blank page. -->
  <script>
    (function () {
      var FILES = ["index.html", "styles.css", "config.js", "js/main.js", "js/db.js", "js/ui.js", "js/mirror.js", "js/photos.js",
        "js/views/home.js", "js/views/products.js", "js/views/product.js", "js/views/prices.js", "js/views/posters.js",
        "js/views/activity.js", "js/views/team.js"];
      function heal() {
        if (window.__fmStarted || window.__fmHealing) return;
        window.__fmHealing = true;
        var again = false;
        try { again = sessionStorage.getItem("fm.healed") === "1"; sessionStorage.setItem("fm.healed", "1"); } catch (e) {}
        if (again) {
          document.body.insertAdjacentHTML("beforeend", '<div id="fm-stuck" style="position:fixed;inset:0;display:grid;place-items:center;background:#f3f5fa;font:16px system-ui;padding:24px;text-align:center;z-index:999"><div><b>The admin could not start.</b><p>Check the internet connection, then <a href="javascript:location.reload()">reload the page</a>.</p></div></div>');
          return;
        }
        Promise.all(FILES.map(function (f) { return fetch(f, { cache: "reload" }).catch(function () {}); }))
          .then(function () { if (!window.__fmStarted) location.reload(); });
      }
      window.addEventListener("error", function (e) {
        var t = e.target;
        var ownFile = t && t.tagName === "SCRIPT" && String(t.src || "").indexOf(location.origin) === 0;
        var ownCode = e.message && String(e.filename || "").indexOf(location.origin) === 0;
        if (ownFile || ownCode) heal();
      }, true);
      setTimeout(heal, 20000);
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
